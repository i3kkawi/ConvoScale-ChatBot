name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real service containers, not mocks — the whole point of this project
    # is proving the database layer behaves correctly, so CI runs against
    # the same Postgres/Redis the app uses locally and in production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: convoscale
          POSTGRES_PASSWORD: convoscale_ci_pw
          POSTGRES_DB: convoscale
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U convoscale -d convoscale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: "postgresql://convoscale:convoscale_ci_pw@localhost:5432/convoscale?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_SECRET: "ci-only-secret-not-for-production"
      JWT_EXPIRES_IN: "1h"
      PORT: "4000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed chatbot responses
        run: npm run prisma:seed

      - name: Run tests
        run: npm test
