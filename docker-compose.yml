services:
  postgres:
    image: postgres:16-alpine
    container_name: convoscale-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: convoscale
      POSTGRES_PASSWORD: convoscale_local_pw
      POSTGRES_DB: convoscale
    volumes:
      - convoscale_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U convoscale -d convoscale"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: convoscale-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  convoscale_pg_data:
